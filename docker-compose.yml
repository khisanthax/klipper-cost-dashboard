services:
  kcd:
    image: ghcr.io/khisanthax/klipper-cost-dashboard:latest
    container_name: kcd
    restart: unless-stopped
    ports:
      - "127.0.0.1:6060:5000"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=America/New_York
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health').read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
