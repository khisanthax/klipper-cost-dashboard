name: Release Validation

on:
  pull_request:
  push:
    branches:
      - main
      - "resume/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Compile Python modules
        run: python -m compileall -q app.py core installer kcd tools

      - name: Validate SQL-only filesystem isolation
        run: python tools/validate_sql_only.py

      - name: Build release image
        run: docker build --tag kcd-release-ci .

      - name: Smoke-test release image
        shell: bash
        run: |
          docker run --rm -e KCD_API_KEY=ci-secret kcd-release-ci python -c "import app"
          docker run --rm kcd-release-ci python -m kcd --help
          docker run --rm kcd-release-ci sh -c 'python -m kcd db readiness; code=$?; test "$code" -eq 0 -o "$code" -eq 2'
          docker run --rm kcd-release-ci python tools/kcd_backup.py --help
          docker run --rm kcd-release-ci test -f /app/tools/validate_sql_only.py
          docker run --rm -e KCD_API_KEY=ci-secret kcd-release-ci python tools/validate_sql_only.py
