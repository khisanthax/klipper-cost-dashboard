name: Python Compile Check

on:
  push:
    paths:
      - "core/**.py"
      - ".github/workflows/py-compile.yml"
  pull_request:
    paths:
      - "core/**.py"
      - ".github/workflows/py-compile.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile core modules
        run: |
          python -m py_compile core/storage.py
          python -m compileall core
