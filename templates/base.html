<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klipper Cost Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

    <!-- Custom styles -->
    <style>
        .navbar-brand {
            font-weight: bold;
        }
        .kcd-thumb { display:block; object-fit:cover; border-radius:6px; }
        .kcd-thumb-small { width:56px; height:56px; }
        .kcd-thumb-card  { width:160px; height:160px; }
        .kcd-thumb-placeholder { display:inline-block; border-radius:6px; width:56px; height:56px; opacity:0.15; background: currentColor; }
        .kcd-thumb-placeholder.kcd-thumb-card { width:160px; height:160px; }
    </style>
</head>

<body>
    <!-- Navigation Header -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('index') }}">Klipper Cost Dashboard</a>
            <div class="d-flex flex-wrap gap-2 ms-auto">
                <a class="btn btn-sm btn-outline-light {% if request.path == '/' %}active{% endif %}"
                    href="{{ url_for('index') }}">Dashboard</a>
                <a class="btn btn-sm btn-outline-light {% if request.path.startswith('/reports') %}active{% endif %}"
                    href="{{ url_for('reports_page') }}">Reports</a>
                <a class="btn btn-sm btn-outline-light {% if request.path.startswith('/projects') %}active{% endif %}"
                    href="{{ url_for('projects_page') }}">Projects</a>
                <a class="btn btn-sm btn-outline-light {% if request.path.startswith('/recalculate') %}active{% endif %}"
                    href="{{ url_for('recalculate_page') }}">Recalculate</a>
                <a class="btn btn-sm btn-outline-light {% if request.path.startswith('/settings') %}active{% endif %}"
                    href="{{ url_for('settings_printers_page') }}">Settings</a>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="container my-4">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
</body>

</html>
