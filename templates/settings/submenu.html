<div class="btn-group flex-wrap" role="group" aria-label="Settings pages">
    <a href="{{ url_for('settings_printers_page') }}"
       class="btn btn-outline-primary {% if request.path.startswith('/settings/printers') %}active{% endif %}">
        Printers
    </a>
    <a href="{{ url_for('settings_profiles_page') }}"
       class="btn btn-outline-primary {% if request.path.startswith('/settings/profiles') %}active{% endif %}">
        Profiles
    </a>
    <a href="{{ url_for('settings_display_page') }}"
       class="btn btn-outline-primary {% if request.path.startswith('/settings/display') %}active{% endif %}">
        Display
    </a>
    <a href="{{ url_for('settings_other_page') }}"
       class="btn btn-outline-primary {% if request.path.startswith('/settings/other') %}active{% endif %}">
        Other
    </a>
    {% if show_advanced %}
    <a href="{{ url_for('settings_pause_page') }}"
       class="btn btn-outline-primary {% if request.path.startswith('/settings/pause') %}active{% endif %}">
        Pause Accounting
    </a>
    {% endif %}
    <a href="{{ url_for('system_events_page') }}"
       class="btn btn-outline-primary {% if request.path.startswith('/system-events') %}active{% endif %}">
        System Events
    </a>
</div>
